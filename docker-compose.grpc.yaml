version: '3.8'
services:
  grpc-server:
    build:
      context: .
      dockerfile: src/adapters/CycleBike.Adapters.gRPC/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8081
    depends_on:
      - postgres
      - redis
      - rabbitmq
    networks:
      - cyclebike-network

networks:
  cyclebike-network:
    external: true