services:
  cycle-bike:
    build:
      context: .
      dockerfile: src/adapters/CycleBike.Adapters.WebApi/Dockerfile
    image: cycle-bike:1.0.0
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - 8080:5161
    networks:
      - cycle-bike
    depends_on:
      - mongodb
      - redis
      - rabbitmq
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
  
  mongodb:
    build: 
      context: .
      dockerfile: src/adapters/CycleBike.Adapters.Infrastructure/Modules/MongoDB/Dockerfile
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: username
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - 27017:27017
    networks:
      - cycle-bike   

  rabbitmq:
    image: rabbitmq:3.9-management-alpine
    restart: always
    ports:
      - 5672:5672
      - 15672:15672
    networks:
      - cycle-bike
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    depends_on:
      - mongodb

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - 6379:6379
    networks:
      - cycle-bike
    command: redis-server --user cycle-bike on nopass ~* &* +@all
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

networks:
  cycle-bike:
    driver: bridge