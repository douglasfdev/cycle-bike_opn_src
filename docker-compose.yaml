services:
  cycle-bike:
    build:
      context: .
      dockerfile: src/adapters/CycleBike.Adapters.WebApi/Dockerfile
    image: cycle-bike:1.0.0
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=cycle-bike-api
    ports:
      - 8080:5161
    networks:
      - cycle-bike
    depends_on:
      - mongodb
      - redis
      - rabbitmq
      - psql
      - otel-collector
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.0
    ports:
      - 18888:18888
    environment:
      - DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS=true
      - DOTNET_DASHBOARD_OTLP_ENDPOINT_URL=http://0.0.0.0:18889
    networks:
      - cycle-bike

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.91.0
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - 4317:4317
      - 4318:4318
    networks:
      - cycle-bike
    depends_on:
      - aspire-dashboard
  
  mongodb:
    build: 
      context: .
      dockerfile: src/adapters/CycleBike.Adapters.Infrastructure/Modules/MongoDB/Dockerfile
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: username
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - 27017:27017
    networks:
      - cycle-bike

  psql:
    image: postgres:alpine3.23
    restart: always
    environment:
        POSTGRES_USER: username
        POSTGRES_PASSWORD: password
        POSTGRES_DB: cycle-bike
    ports:
      - 5432:5432
    networks:
      - cycle-bike
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "username" ]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.9-management-alpine
    restart: always
    ports:
      - 5672:5672
      - 15672:15672
    networks:
      - cycle-bike
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    depends_on:
      - mongodb

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - 6380:6379
    networks:
      - cycle-bike
    command: ["redis-server", "--user", "default", "off", "--user", "cycle-bike", "on", ">cyclepass123", "~*", "&*", "+@all"]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  redis-insight:
    image: redis/redisinsight:latest
    restart: always
    ports:
      - 5540:5540
    environment:
      - RI_APP_HOST=0.0.0.0
      - RI_APP_PORT=5540
      - RI_REDIS_HOST0=redis
      - RI_REDIS_PORT0=6379
      - RI_REDIS_USERNAME0=cycle-bike
      - RI_REDIS_PASSWORD0=cyclepass123
      - RI_REDIS_ALIAS0=CycleBike-Redis
    networks:
      - cycle-bike
    volumes:
      - redis_insight_data:/data
    depends_on:
      - redis

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://psql:5432/cycle-bike
      KC_DB_USERNAME: username
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - 8081:8080
    networks:
      - cycle-bike
    depends_on:
      psql:
        condition: service_healthy

  kong-migrations:
    image: kong:latest
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: psql
      KONG_PG_USER: username
      KONG_PG_PASSWORD: password
      KONG_PG_DATABASE: cycle-bike
    command: kong migrations up && kong migrations finish
    networks:
      - cycle-bike
    depends_on:
      psql:
        condition: service_healthy

  kong:
    image: kong:latest
    environment:
      KONG_DATABASE: postgres          # Define que usará DB
      KONG_PG_HOST: psql               # Aponta para seu container Postgres
      KONG_PG_USER: username
      KONG_PG_PASSWORD: password
      KONG_PG_DATABASE: cycle-bike
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
    depends_on:
      kong-migrations:
        condition: service_completed_successfully
    ports:
      - 8082:8000
      - 8443:8443
      - 8001:8001
    networks:
      - cycle-bike

  konga:
    image: pantsel/konga
    ports:
      - 1337:1337
    environment:
      - NODE_ENV=development
    networks:
      - cycle-bike
    depends_on:
      - kong

networks:
  cycle-bike:
    driver: bridge

volumes:
  redis_insight_data: