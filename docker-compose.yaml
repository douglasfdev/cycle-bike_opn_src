services:
  cycle-bike:
    build:
      context: .
      dockerfile: src/adapters/CycleBike.Adapters.WebApi/Dockerfile
    image: cycle-bike:1.0.0
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - 5161:5161
    networks:
      - cycle-bike
    depends_on:
      - mongodb
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
  
  mongodb:
    build: 
      context: .
      dockerfile: src/adapters/CycleBike.Adapters.NoSQL/Dockerfile
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: username
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - 27017:27017
    networks:
      - cycle-bike
        
  rabbitmq:
    image: rabbitmq:3.9-management-alpine
    restart: always
    ports:
      - 5672:5672
      - 15672:15672
    networks:
      - cycle-bike
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    depends_on:
      - mongodb

networks:
  cycle-bike:
    driver: bridge